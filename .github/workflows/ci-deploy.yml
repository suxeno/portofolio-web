name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cms-publish:
        description: Require configured Sanity content for this build
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Baseline regression tests (local content)
        env:
          SANITY_PROJECT_ID: ''
          SANITY_DATASET: ''
        run: bun run test
      - name: Build production output
        env:
          # Public deployment identifiers, not credentials.
          SANITY_PROJECT_ID: wmzxcxbs
          SANITY_DATASET: production
          CMS_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs['cms-publish'] && 'true' || 'false' }}
        run: node scripts/ci-production-build.mjs
      - run: bun run check:deploy
      - name: Deploy tested build
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: bun x --no-install wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
